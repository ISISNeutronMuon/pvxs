# Drives patches/generate.sh and patches/verify.sh.
#
# Each row is one patch: <name> <base-branch> <feature-branch>. <name>.patch
# and <name>/ are generated by diffing base-branch..feature-branch (see
# generate.sh). base-branch must itself be "master" or another row's
# feature-branch, since apply.sh only ever composes patches on top of
# 01-infrastructure (or master, for 01-infrastructure itself).
#
# To add a new patch: create its feature branch off the right base branch,
# add a row here, then run patches/generate.sh <name>.

01-infrastructure    master                    patch-01-infrastructure
02-alarm-messages    patch-01-infrastructure   patch-02-alarm-messages
03-pvfilter          patch-01-infrastructure   patch-03-pvfilter
